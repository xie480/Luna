    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

auth:
  username: Yilena
  password: XUWENBO219382
  jwt-secret: "replace-with-a-strong-random-secret"
  jwt-expire-seconds: 86400

mybatis-plus:
  type-aliases-package: org.yilena.luna.*.entity
  type-handlers-package: com.baomidou.mybatisplus.extension.handlers
  mapper-locations: classpath:/mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
    enable-sql-runner: true
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    map-underscore-to-camel-case: true
    cache-enabled: false
    local-cache-scope: statement

embedding:
  python-path: D:/AI_Models/BGE-base-zh-v1.5/bge-env/Scripts/python.exe
  script-path: ./python/embedding.py
  model-path: D:/AI_Models/bge-base-zh-v1.5-model

rerank:
  model-path: D:/AI_Models/bge-reranker-v2-m3
  script-path: ./python/rerank.py

# 方案A：本机常驻 HTTP 推理服务配置
inference:
  http:
    enabled: true
    embedding-url: http://127.0.0.1:18080/embedding
    rerank-url: http://127.0.0.1:18081/rerank
    timeout-ms: 1500
    fallback-local: true

memory:
  session-type:
    enabled: true
  perceptual-buffer:
    enabled: true
    ttl-minutes: 90
  legacy-readonly:
    enabled: true

audit:
  replay-mode: window
  tool-results-window-limit: 8
  context-snapshots-window-limit: 3

serper:
  api-key: fe2bc5deb3372b8fc2823c2031e06a209e20bd75

xxl-job:
  access-token: Yilena
  admin:
    addresses: http://192.168.100.128:9001/xxl-job-admin
  executor:
    ip: 192.168.1.5
    application-name: luna
    port: 19999
    log-retention-days: 30

rocketmq:
  name-server: 192.168.100.128:9876
  producer:
    group: luna_group
    send-message-timeout: 2000
    retry-times-when-send-failed: 1
    retry-times-when-send-async-failed: 1

luna:
  mcp:
    migration:
      auto-enabled: false
      validation-enabled: true
      read-legacy-enabled: false
      fail-on-legacy-pending: false
    execution:
      allow-legacy-mode: false
      allow-spring-bean: false
    compat:
      skill-endpoint-enabled: false
  rag:
    default-timeout-ms: 2500
    compression-max-chars: 500
    compression-summary-sentences: 2
    compression-merge-similarity-chars: 80
    dedup-semantic-similarity-threshold: 0.88
    dedup-semantic-cross-source-threshold: 0.92
    compression-semantic-merge-threshold: 0.86
    agentic-max-steps: 4
    agentic-max-calls: 6
    agentic-max-total-top-k: 24
    agentic-min-evidence: 4
    agentic-semantic-sufficiency-threshold: 0.7
    agentic-semantic-stage-coverage-ratio: 0.7

